    \ = 送过去 = 传播。拆开看，就不混了。\n\n还有哪个 trans- 词你拿不准的？扔过来。\n\n**\U0001F338**: Two roundabouts\
    \ were built — one at each end of Hospital Road — significantly improving traffic\
    \ flow. 这个破折号我感觉很地道 也可以用逗号代替吧？所以能用逗号的地方要考虑用破折号吗？\n\n**\U0001F916**: 好眼力，这个破折号确实是我的一个小设计。直接说结论：\n\
