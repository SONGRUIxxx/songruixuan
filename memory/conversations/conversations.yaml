  summary: '你问到邮局，我跟你讲清楚南方周末的订阅方式。


    **南方周末订阅渠道有三类：**


    **1. 邮局订阅（最传统）**

    - 去你所在城市的任何一个邮政网点，填一张订阅单

    - 或者在「中国邮政微邮局」公众号里在线订

