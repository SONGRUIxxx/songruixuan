    ## 一、市面上有吗？


    接近但不重合。


    | 产品 | 有什么 | 缺什么 |

    |------|--------|--------|

    | **Replika** | 个人AI伴侣、记忆你、陪你聊天 | 没有社交网络、没有Agent间互联 |

    | **Character.ai** | 你可以创建自己的AI角色 | 那个角色不是"你"，是一个角色、没有记忆库的深度 |

    | **微信** | 社交网络 + 支付 + 生态 | 没有"你的AI"这个层——你用的是同一个微信，不是"你的菘蕊萱" |

    | **Personal AI (personal.ai)** | 训练一个"数字孪生"、记忆你的东西 | 只在toB/小众圈、没有做成社交网络 |


    **你说的东西 = Personal AI 的"自己" + 微信的"社交关系网" + 你自己加的影库/相册索引。**


