    \ improving traffic flow.\n③ Two roundabouts were built (one at each end of Hospital\
    \ Road), significantly improving traffic flow.\n```\n\n| 写法 | 效果 |\n|---|---|\n\
    | 逗号 | 平铺直叙，信息顺过去，不强调 |\n| 破折号 | **突然把镜头推近**，读者停一下，看清楚细节，再回来 |\n| 括号 | 更像\"小声补充一句\"\
    ，最弱 |\n\n---\n\n## 什么时候用破折号而不是逗号？\n\n三个场景，记牢就够用：\n\n### 1. 插入解释，想制造停顿感\n\n> The\
    \ bus station was relocated — positioned between the two roundabouts — for easier\
    \ access.\n\n用逗号的话，\"positioned between the two roundabouts\" 会和其他逗号打架（前面 relocation\
    \ 后面 for easier access 都可能是逗号连接的部分）。破折号帮你把层次拉开，读者一眼知道这是**插进来的一句话**，不会和主句结构混淆。\n\
    \n### 2. 插入的内容本身带逗号\n\n> Three facilities — the bus station, the staff car park,\
    \ and the public car park — were rearranged.\n\n如果这里用逗号包住这个插入语，就会变成：\n\n> Three\
    \ facilities, the bus station, the staff car park, and the public car park, were\
    \ rearranged.\n\n五个逗号连成一片，读者得停下来数哪个是哪个。破折号天然做了\"切分\"，层次清晰。\n\n### 3. 想制造戏剧性的强调\n\
    \n> The original shared car park was converted into a staff-only facility — while\
    \ the public got a brand-new one on the east side.\n\n这里破折号制造了一个停顿，让读者期待\"那公众怎么办？\"\
    ，然后给出回答。逗号没有这种叙事节奏。\n\n---\n\n## IELTS 写作能用破折号吗？\n\n**能，而且偶尔用一个很加分。**\n\n考官看到的\
