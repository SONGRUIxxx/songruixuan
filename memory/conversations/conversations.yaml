    ## 王小波怎么处理的


    他写那只猪，从头到尾写猪：猪跳围栏、猪跑掉了、猪长出了獠牙。他没写"这只猪代表了我"——但他写了"我倒是见过很多想要设置别人生活的人，还有很多对被设置的生活安之若素的人"。然后接了一句："因为这个缘故，我一直怀念这只特立独行的猪。"


    他也没写"我就是这只猪"。但读者读到"怀念"的时候就懂了——**你怀念的，是你身上失去了的东西。**


    你是旁白，但你是那个在围栏里的人。你朋友在外面。黑水鸡也在外面。你在念，你在怀念，你在说"它很丑但它自由"——你朋友的画面沉默地证明你说的每一句话。


    ---


    ## "干脆就真的拍人"——这是两条路


    **A. 正面拍人。** 旁白直接说"我有一个朋友，她很特立独行"。画面拍她的日常。黑水鸡可以不出现。这是王小波的路——猪只是一个引子，真正说的是人。


    **B. 你现在这条路。** 旁白说黑水鸡，画面拍她。互不提及。并置。最后画作翻过来——是黑水鸡。


    A 更直接，更安全，观众不会困惑。B 更难，但更有张力——观众在"困惑→发现→懂了"的过程中，自己完成了意义。


    你之前选的是 B。你现在问要不要改成 A。


    ---


    ## 我的看法


    你不用选。


    你的片名叫"一只特立独行的鸡"。王小波的读者看到这个标题就会触发记忆——"猪"。他们已经知道这个片子的对话对象是谁了。你不是在抄袭，你是在**致敬并改写**：他把特立独行写成一头猪，你把它写成一只鸡。他把猪送进荒野，你把鸡留在水面。他怀念它，你画它。


    你的观众不需要你在旁白里解释"这是致敬王小波"。标题已经说了。


    所以你不用正面拍人。你不用解释。你不用把隐喻拆开。王小波替你做了这个工作。你只需要把你现在的结构做到极致：旁白说黑水鸡，画面拍她，最后画翻过来——那一刻，王小波的读者会在弹幕里打下"一只特立独行的猪"。


    这个不是抄袭，是对话。


