    \n---\n\n## 一个参照系\n\n你知道**蔡明亮**吗？他拍台北，但从来不在片子里说\"这是台北\"。他拍的是雨、走廊、人的背影。观众感受到的是一种湿热的存在感。知道台北的人会说\"\
