    \n---\n\n#### 第二组：传递的（trans + fer/mit/port）\n\n这组最容易混，因为中文都可能翻译成\"转/传\"。\n\n|\
    \ 词 | 画面 | 关键区别 | 例句 |\n|---|---|---|---|\n| **transfer** | 把东西从 A 点搬到 B 点 | 强调**位置/归属的变更**\
    \ | transfer money（转账）、transfer to another school（转学） |\n| **transport** | 把东西运过去\
