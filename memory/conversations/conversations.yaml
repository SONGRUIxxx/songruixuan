    \ 人生果实 | 穿条纹睡衣 | 教父 |\n|---|---|---|---|\n| **旧** | 三层 → 全绑黑水鸡 | 三层 → 黑水鸡 + 你写过的那个镜头\
    \ | 五层 → 刚改完 |\n| **新** | 三层 → 固定镜头即态度 / 选择即暴力 / 时间的节奏 | 四层 → 限定视角是伦理 / 日常化呈现\
