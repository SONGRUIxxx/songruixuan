    - 休学政策也有，但流程上据说比NUS多一些审批环节\n\n**对你的\"休学半年积累经验再秋招\"计划而言**，NUS的灵活性和地理位置优势更明显。但NTU也没硬伤，关键看你能不能把签证安排好——这是你在新加坡实习最大的约束条件。\n\
    \n> ⚠️ 提醒：留学签证（Student Pass）通常允许每周最多16小时兼职，课程内实习（IA）不受限制。但如果你休学期间要做全职实习，需要换签证类型（如Training\
    \ Employment Pass）。这个在规划阶段就要搞清楚。\n\n---\n\n### \U0001F9ED 决策框架\n\n不要用\"哪个更好\"\
    的思维。用这个框架问自己：\n\n**1. 研究导向 vs 就业导向？**\n- 想读博或做研究型工作 → 重点看教授/实验室匹配度\n- 核心目标是秋招上岸\
    \ → 重点看实习便利性和career service\n\n**2. Agent方向的选择（你未来半年会逐渐清晰的）**\n- 偏感知-行动闭环（机器人、自主决策）\
    \ → NUS\n- 偏多智能体博弈（机制设计、联邦学习） → NTU\n\n**3. 回国 vs 留新加坡？**\n- 回国 → NUS综合声望略高，尤其在非技术圈（银行、国企、咨询）\n\
    - 留新加坡 → 两校在当地tech圈差别不大，看实习积累\n\n**4. 预算差1万新币重要吗？**\n- 如果这笔钱在你的决策权重里排前三，NTU性价比更高\n\
    - 如果不是，建议忽略这个差异\n\n---\n\n### \U0001F914 说实话\n\n你的背景（同济AI + AI Agent毕设 + 有明确规划）申这两所都没问题。关键不是你\"\
    能不能进\"，而是\"哪所更匹配你接下来 两年的路径\"。\n\n你现在面临的选择，本质上是：\n\n- **NUS** = 更稳妥的路径 + 更好的实习地理条件\
    \ + 对你Agent方向更直接的教授匹配\n- **NTU** = 稍低的成本 + 如果方向转向多智能体博弈则更优 + 更安静的校园环境\n\n---\n\
