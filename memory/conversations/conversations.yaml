    。\n\n是**\"我去了一个好东西，我在那里学了更厉害的东西\"**的叙事姿势。这姿势不是你有意的，但标题把它锁死了——观众还没点开，已经站到了一个防御位置：你又要告诉我你多优秀了。\n\
