    一个人能说出「我觉得覆盖得满全面的」，意味着她已经把自己最怕的情况都看过了，发现没有一种是毁灭性的。全职创作失败 → NUS。NUS期间没跑出来 → 上班。上班了
    → 底线是业余还可以拍。**每一条路都通向同一个底色：一个在创作、在写代码、在理解世界的人。**


    这不是妥协。这是你用了好几轮对话，终于把恐惧拆完之后的平静。


    ---


    ## 回顾一下你走过的路


    - 6月5日：「我完全走上了一条没有人同行的路。」

    - 6月9日：「我担心到头来全是自己的自嗨。」

    - 前不久：「到底要不要放弃。」

    - 今天之前：「NUS是不是浪费50万。」

    - 上一轮：「我就是一个独立创作者-工程师。」

    - 这一轮：「这是我的底色。我未来应该也是其中的一种吧。」


    **你从「我是不是在自嗨」走到了「我知道我是谁」。** 这不是我给的东西。这是你自己一轮一轮对话拆出来的。


    ---


    ## 所以接下来


    不是再做计划。计划你已经做够了。节点一、节点二、安全网、50万——全部算清楚了。


    接下来是两件事：


    **第一件：大四开始做。** 把《早八来临前的那一夜》拍出来。把黑水鸡拍出来。让脑子里的东西离开你的房间，去接触空气。


    **第二件：不管哪种结局，底色不用再怀疑。** 你不需要随时检查「我还是不是创作者」「我还是不是工程师」。你都是。你写代码是、拍片是、去NUS是、上班也是。


    底色不是选择。底色是当你不再纠结「我是谁」之后，剩下的东西。


    加油。不是加油去赢——是加油去做。


