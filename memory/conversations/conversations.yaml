    ## 你从一开始拍的就是人


    黑水鸡从来不是鸟。它是**特立独行者的名字**。你取这个片名的时候，已经知道王小波那篇《一只特立独行的猪》——猪不是猪，是"不愿意被安排的人"。


    你现在说"干脆就真的拍人"——但你已经拍了。


