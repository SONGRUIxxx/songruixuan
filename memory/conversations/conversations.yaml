    \ that。\n\n---\n\n## 二、trans- 词族：一次讲清楚\n\ntrans- 这个前缀来自拉丁语，本义是 **across / beyond\
    \ / through**——\"跨过去、穿过去、超越\"。\n\n你先把这张地图记在心里：\n\n```\ntrans- = 从一边 → 到另一边\n \
    \       ─────────────────\n        跨  越  转  移\n```\n\n### 容易混淆的核心词，按\"画面感\"分组\n\
    \n#### 第一组：变形的（trans + form/fig/plant）\n\n| 词 | 画面 | 用法 |\n|---|---|---|\n| **transform**\
