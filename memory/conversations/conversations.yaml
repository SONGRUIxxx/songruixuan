    ---\n\n### \U0001F3AF 关键：AI Agent 方向匹配度\n\n这是你最该关注的维度。两所学校都有做Agent相关研究的教授，但侧重点不同：\n\
    \n**NUS：更偏向感知+决策的Agent系统**\n\n- **David Hsu** — 做机器人规划与决策、Partially Observable\
    \ MDP、人机协作。如果你对embodied agent感兴趣，他是 顶级的\n- **Bryan Low** — 多智能体系统、联邦学习中的agent协作\n\
    - **NExT++研究中心** — 多模态AI agent、知识驱动的人机交互\n- **AI Singapore** — 国家级AI计划，有大量落地项目，适合做实习跳板\n\
    \n**NTU：更偏向多智能体博弈与协作**\n\n- **Bo An** — 多智能体系统、博弈论、计算经济学。如果你对agent之间的策略交互（例如拍卖、协商、资源分配）感兴趣，他是该领域顶级\n\
    - **Han Yu** — 可信联邦学习、多智能体协作中的激励机制\n- **S-Lab / AI Research Centre** — 偏视觉+多模态，也有一些agent相关\n\
    \n**一句话判断**：你的AI Agent如果偏**单agent的感知-推理-行动闭环**（比如你之前描述的Agent毕设方向），NUS匹配度 更高。如果偏**多agent博弈/协调/机制设计**，NTU更强。\n\
    \n---\n\n### \U0001F3E2 实习与你的\"休学-秋招\"路径\n\n这是你之前规划的关键环节。两所学校在这方面的差异**比你想象的大**：\n\
    \n**NUS：**\n- Kent Ridge靠近One-North（新加坡科技园区），Grab、Shopee、ByteDance新加坡办公室都在那一片\n\
