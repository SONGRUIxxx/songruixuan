    ## 这个改动发生了什么


    「一只特立独行的鸡」→「一只特立独行的小鸟」


    | | 鸡 | 小鸟 |

    |---|---|---|

    | 中文联想 | 口语化，可能有歧义 | 中性，轻，有一点脆弱感 |

    | 与王小波的关系 | 太近了，容易被读成"致敬" | 拉远了一步——是对话，不是模仿 |

    | 对朋友 | "鸡"不能用来形容女生 | 安全 |

    | 对黑水鸡本身 | 它在生物学上确实是秧鸡科 | 但观众不需要知道这个 |


    叫「小鸟」还有一层好：**它更小，更轻，更不起眼。**


    黑天鹅是大的、华丽的、显眼的。小鸟是你在水面上差点没看到的东西。它不在围栏里，也没有人会专门跑来看它。它只是一个黑点，在水面上漂着。


    这个片名不张扬。和你的原则一致——不给负担，不贴标签，不自证。


