    - **NTU Master of Science in Artificial Intelligence**：同样纯AI。课程偏算法和系统。


    这两个都比你之前考虑的DSML更"纯粹"。DSML是好专业，但它的"数据科学"那一半确实会拉你往统计和金融方向偏。你要的是**AI系统**——Agent架构、多模态、推理——这些东西在纯AI项目里更集中。


