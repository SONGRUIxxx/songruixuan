    ## 为什么这个决定更对


    ### 之前的问题：两根柱子


    你把「AI/Agent工程师」和「量化」当成两根并行的柱子，试图在中间架桥。但那个桥是悬空的——量化岗招的是数学/统计背景的人，Agent岗招的是系统工程能力强的人。两个岗位的面试官看的是两份不同的简历。


