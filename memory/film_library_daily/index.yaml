- file: 00010.jpg
  film: 人生果实
  scene: 供餐
  desc: '修一遗像前的供餐。三层照片背景：正中修一坐像、左侧两人林间合影、右侧小圆框。 托盘里：白米饭、奶汁炖菜、深色茶、莲藕小食，还有一杯果汁。右侧两个裹白布的骨灰盒，
    蝴蝶结工整。平视视角，自然光从斜上方洒下。陶瓷碗手作感粗粝，米饭粒粒分明。 如常——修一爱吃的，一样不少。

    '
