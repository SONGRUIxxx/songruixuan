frames:
- file: 00001.jpg
  film: 人生果实
  scene: 庭院并肩
  desc: '修一与英子并肩坐在自家庭院石阶上，戴手工编织草帽。修一着深蓝长袖，英子淡蓝高领衫配米色长裤。 水平构图，红砖地面和石阶形成稳定基线。繁茂绿树环绕，阳光穿过叶片——通透、略微过曝，消解了阴影。
    树枝上黄色标牌隐约可见。两人手交叠膝上，无眼神交流却充满默契。 静谧的欢愉。

    '
  tags:
  - 庭院
  - 并肩
  - 草帽
  - 黄色标牌
  - 自然光
  - 水平构图
  - 日常
- file: 00002.jpg
  film: 人生果实
  scene: 樱花树下
  desc: '修一与英子并肩走在樱花盛开的路上。修一戴白色渔夫帽和黑框眼镜，深蓝防风夹克；英子落后半步， 乳白高领毛衣，背着深褐色编织手工包，脸上是极具感染力的笑容。浅景深将樱花和房屋虚化为粉色光斑。
    向镜头走来的动势制造出亲切的邀约感。

    '
  tags:
  - 樱花
  - 散步
  - 渔夫帽
  - 编织包
  - 浅景深
  - 春日
  - 陪伴
- file: 00003.jpg
  film: 人生果实
  scene: 黄色标牌与醋橘
  desc: '特写。亮黄色手写木质标牌悬挂在枝头："スダチ ドレッシング用です"（醋橘，用来做沙拉酱的）。 左侧青绿色未熟醋橘挂在枝头。浅景深将背景化开为圆润绿色光斑。金属丝悬挂的标牌仿佛在微风中轻晃。
    修一与植物的对话——每颗果实都有名字。

    '
  tags:
  - 标牌
  - 醋橘
  - 特写
  - 浅景深
  - 手写
  - 果园
  - 细节
- file: 00004.jpg
  film: 人生果实
  scene: 87+90=177 手绘
  desc: '修一的简笔自画像。两人并肩而立，手紧紧相牵。衣服上分别写着"87"和"90"，右侧标注"= 177"。 稚拙的线条，纸上可见粗糙纹理。右下角红色方印。暖灰调，淡赭石色面部，微光从侧上方洒下。
    不是数学加法——是六十五年重叠成一个人的重量。

    '
  tags:
  - 手绘
  - 简笔画
  - 87+90=177
  - 印章
  - 纸张纹理
  - 手工感
- file: 00005.jpg
  film: 人生果实
  scene: 给花子的贺卡
  desc: '俯视特写。修一给孙女花子的手绘贺卡。朱红色彩铅画了一个穿剑道护具的小人，旁边手写： "やったね!! おめでとう！"（做到了！！恭喜！）——祝贺通过剑道三段考试。
    纸张米白，略微倾斜置于深褐色木桌上。墨色签字笔与朱红蜡笔的质朴对比。 认真对待每一件小事。

    '
  tags:
  - 贺卡
  - 花子
  - 剑道
  - 手绘
  - 俯视
  - 朱红
  - 木桌
- file: 00006.jpg
  film: 人生果实
  scene: 告别
  desc: '修一去世后。英子穿深色丧服，俯身抚摸修一的胸口。修一安详躺在藤编床头的白色提花被褥下， 穿着标志性条纹衫。背后是使用了几十年的木制收纳柜。左侧阔叶植物为画面注入一抹生命绿色。
    对角线构图——英子向下探视，修一静止承接。字幕："我们就可以以后一起乘船去南太平洋了"。 自然柔光，低饱和暖棕与黑白。悲而不伤，哀而不怨。

    '
  tags:
  - 告别
  - 死亡
  - 英子
  - 藤床
  - 丧服
  - 对角线构图
  - 南太平洋
- file: 00007.jpg
  film: 人生果实
  scene: 草莓蛋糕上的手
  desc: '极近特写。布满皱纹和斑点的手，将最后一颗鲜红草莓安放在厚涂奶油的蛋糕上。 草莓表面微湿光泽，奶油手工感的不规则边缘，焦黄饼底。浅景深背景隐约蓝白桌布。
    红、白、金黄——自然侧光勾勒出手背每一道纹理。劳作的尊严，缓慢的仪式。

    '
  tags:
  - 手
  - 草莓
  - 蛋糕
  - 特写
  - 皱纹
  - 奶油
  - 料理
  - 劳作
- file: 00008.jpg
  film: 人生果实
  scene: 橡果与落叶
  desc: '低角度近景。两枚圆润橡果与一颗松果静卧在层层叠叠的枯叶间。虫蛀的叶孔、清晰的脉纹、 卷曲的干边——每一片叶子都在讲述时间。大地色系：枯黄、焦棕、土色。阴天或林荫自然散光，
    均匀柔和。众生归土，种子里藏着春天。

    '
  tags:
  - 橡果
  - 松果
  - 落叶
  - 大地色
  - 低角度
  - 微观
  - 生命循环
- file: 00009.jpg
  film: 人生果实
  scene: 握彩铅的手
  desc: '手部特写。布满青筋、皱纹和老年斑的手，稳稳握住橘红色彩铅，在纸上为简笔画填色。 左手按纸，右手运笔。深色针织毛衣袖口。暖灰与米白基调中，笔尖那一抹橘红是呼吸点。
    静谧的专注——即便手指不再细腻，握笔依旧坚定。

    '
  tags:
  - 手
  - 彩铅
  - 填色
  - 特写
  - 皱纹
  - 专注
  - 手工
- file: 00010.jpg
  film: 人生果实
  scene: 供餐
  desc: '修一遗像前的供餐。三层照片背景：正中修一坐像、左侧两人林间合影、右侧小圆框。 托盘里：白米饭、奶汁炖菜、深色茶、莲藕小食，还有一杯果汁。右侧两个裹白布的骨灰盒，
    蝴蝶结工整。平视视角，自然光从斜上方洒下。陶瓷碗手作感粗粝，米饭粒粒分明。 如常——修一爱吃的，一样不少。

    '
  tags:
  - 供餐
  - 遗像
  - 骨灰盒
  - 米饭
  - 祭坛
  - 如常
  - 告别之后
- file: 00011.jpg
  film: 人生果实
  scene: 90+87=177 环抱
  desc: '修一另一幅简笔画。修一的身体线条像一个三角形，将英子环抱在前。粗铅笔颗粒感， 自然纸色，红色墨水标注"87""90""+177"。非精确的线条、毛糙边缘——像孩子画的，
    出自一位九十岁建筑师之手。轻盈地消解了衰老的沉重。

    '
  tags:
