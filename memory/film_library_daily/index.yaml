- file: 00003.jpg
  film: 人生果实
  scene: 黄色标牌与醋橘
  desc: '特写。亮黄色手写木质标牌悬挂在枝头："スダチ ドレッシング用です"（醋橘，用来做沙拉酱的）。 左侧青绿色未熟醋橘挂在枝头。浅景深将背景化开为圆润绿色光斑。金属丝悬挂的标牌仿佛在微风中轻晃。
    修一与植物的对话——每颗果实都有名字。

    '
