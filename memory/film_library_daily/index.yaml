- file: 00006.jpg
  film: 人生果实
  scene: 告别
  desc: '修一去世后。英子穿深色丧服，俯身抚摸修一的胸口。修一安详躺在藤编床头的白色提花被褥下， 穿着标志性条纹衫。背后是使用了几十年的木制收纳柜。左侧阔叶植物为画面注入一抹生命绿色。
    对角线构图——英子向下探视，修一静止承接。字幕："我们就可以以后一起乘船去南太平洋了"。 自然柔光，低饱和暖棕与黑白。悲而不伤，哀而不怨。

    '
