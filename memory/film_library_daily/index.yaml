- file: 00005.jpg
  film: 人生果实
  scene: 给花子的贺卡
  desc: '俯视特写。修一给孙女花子的手绘贺卡。朱红色彩铅画了一个穿剑道护具的小人，旁边手写： "やったね!! おめでとう！"（做到了！！恭喜！）——祝贺通过剑道三段考试。
    纸张米白，略微倾斜置于深褐色木桌上。墨色签字笔与朱红蜡笔的质朴对比。 认真对待每一件小事。

    '
