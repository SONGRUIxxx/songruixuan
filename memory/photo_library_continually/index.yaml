    ### 构图：

    - **层次感**：照片从近到远分为前景、中景和远景，层次分明，视野开阔。

    - **对称与不对称**：前景的建筑虽然不对称，但其复杂的结构和细节吸引视线；中景和远景则较为对称，给人一种稳定的感觉。

