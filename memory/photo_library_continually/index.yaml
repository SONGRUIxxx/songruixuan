    - **对称性**：虽然不是严格的对称，但整体构图较为平衡，电视塔位于画面的中心偏左位置，成为视觉的中心。

    - **引导线**：电视塔的垂直线条引导观众的目光从地面延伸到天空，增强了画面的纵深感。


