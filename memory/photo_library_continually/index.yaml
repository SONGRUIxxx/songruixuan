    ### 色调

    色调以暖黄色为主，路灯的光芒和建筑上的灯光共同营造出一种温暖而柔和的氛围。黑色的夜空与明亮的灯光形成鲜明对比，增强了画面的层次感。整体色调偏暗，符合夜晚的环境特点。


    ### 情绪氛围

    照片的情绪氛围显得宁静而神秘。夜晚的光线和阴影交织在一起，给人一种安静、平和的感觉，同时也带有一丝未知和探索的意味。建筑的现代设计和灯光的点缀，使得整个场景显得既现代又充满诗意。


